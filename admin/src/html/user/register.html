<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>FMS 관리자 - 회원가입</title>

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Base resets & shared styles -->
    <link
      rel="stylesheet"
      href="../../style/reset.css"
    />
    <link
      rel="stylesheet"
      href="../../style/common.css"
    />
    <link
      rel="stylesheet"
      href="../../style/fonts.css"
    />
    <link
      rel="stylesheet"
      href="../../style/layout/layout.css"
    />
    <link
      rel="stylesheet"
      href="../../style/form/form.css"
    />
    <link
      rel="stylesheet"
      href="../../style/btn/btn.css"
    />
    <link
      rel="stylesheet"
      href="../../style/admin.css"
    />
    <link
      rel="stylesheet"
      href="../../style/user.css"
    />

    <!-- Page specific (Neumorphism) -->
    <link
      rel="stylesheet"
      href="./admin-signup.css"
    />
  </head>

  <body data-theme="vendor">
    <a href="./login.html">뒤로가기</a>

    <main
      id="main"
      class="auth auth--admin"
    >
      <section
        class="auth__container"
        aria-labelledby="auth-title"
      >
        <header class="auth__header">
          <h1
            id="auth-title"
            class="auth__title"
          >
            관리자 회원가입
          </h1>
          <p class="auth__subtitle">계정을 만들어 관리자 콘솔에 접근하세요.</p>
        </header>

        <div
          class="auth-card auth-card--elevated"
          role="region"
          aria-labelledby="auth-title"
        >
          <form
            class="form form--signup auth-form"
            action=""
            method="post"
            novalidate
          >
            <fieldset class="auth-form__fieldset">
              <legend class="sr-only">기본 정보</legend>

              <!-- 아이디 -->
              <div class="form__group auth-form__group">
                <label
                  class="form__label auth-form__label"
                  for="userId"
                  >ID</label
                >
                <input
                  id="userId"
                  type="text"
                  name="userId"
                  class="form__input auth-form__input"
                  placeholder="아이디를 입력하세요"
                  autocomplete="username"
                  required
                  aria-required="true"
                />
                <p
                  class="auth-form__help"
                  id="help-userId"
                >
                  영문 소문자, 숫자 4~16자
                </p>
              </div>

              <!-- 이메일 -->
              <div class="form__group auth-form__group">
                <label
                  class="form__label auth-form__label"
                  for="email"
                  >이메일</label
                >
                <input
                  id="email"
                  type="email"
                  name="email"
                  class="form__input auth-form__input"
                  placeholder="admin@example.com"
                  autocomplete="email"
                  required
                  aria-required="true"
                />
                <p
                  class="auth-form__help"
                  id="help-email"
                >
                  이메일 인증이 필요합니다.
                </p>
              </div>

              <!-- 비밀번호 -->
              <div
                class="form__group auth-form__group auth-form__group--password"
              >
                <label
                  class="form__label auth-form__label"
                  for="userPwd"
                  >비밀번호</label
                >
                <div class="auth-input auth-input--with-addon">
                  <input
                    id="userPwd"
                    type="password"
                    name="userPwd"
                    class="form__input auth-form__input auth-input__control"
                    placeholder="비밀번호를 입력하세요"
                    autocomplete="new-password"
                    required
                    aria-required="true"
                    aria-describedby="pwd-meter"
                  />
                  <button
                    type="button"
                    class="auth-input__addon auth-input__addon--icon u-focus-reset"
                    aria-label="비밀번호 표시 전환"
                    aria-pressed="false"
                    disabled
                    title="향후 스크립트 연결 예정"
                  >
                    <i class="fa-solid fa-eye"></i>
                  </button>
                </div>
                <div
                  class="auth-meter"
                  id="pwd-meter"
                  aria-live="polite"
                >
                  <span
                    class="auth-meter__bar"
                    aria-hidden="true"
                  ></span>
                  <span class="auth-meter__text">비밀번호 강도</span>
                </div>
                <p class="auth-form__help">
                  영문 대/소문자, 숫자, 특수문자 포함 8자 이상
                </p>
              </div>

              <!-- 비밀번호 확인 -->
              <div class="form__group auth-form__group">
                <label
                  class="form__label auth-form__label"
                  for="userPwdConfirm"
                  >비밀번호 확인</label
                >
                <input
                  id="userPwdConfirm"
                  type="password"
                  name="userPwdConfirm"
                  class="form__input auth-form__input"
                  placeholder="비밀번호를 다시 입력하세요"
                  autocomplete="new-password"
                  required
                  aria-required="true"
                />
              </div>

              <!-- 관리자 코드 (선택) -->
              <div class="form__group auth-form__group">
                <label
                  class="form__label auth-form__label"
                  for="adminCode"
                >
                  관리자 코드
                  <span class="auth-form__label-optional">(선택)</span>
                </label>
                <input
                  id="adminCode"
                  type="text"
                  name="adminCode"
                  class="form__input auth-form__input"
                  placeholder="사내 제공 관리자 코드"
                  inputmode="latin"
                />
              </div>

              <!-- 약관 동의 -->
              <div
                class="form__group auth-form__group auth-form__group--checkbox"
              >
                <div class="auth-checkbox">
                  <input
                    id="agreeTerms"
                    type="checkbox"
                    name="agreeTerms"
                    class="auth-checkbox__control"
                    required
                    aria-required="true"
                  />
                  <label
                    for="agreeTerms"
                    class="auth-checkbox__label"
                  >
                    <span
                      class="auth-checkbox__box"
                      aria-hidden="true"
                    ></span>
                    <span class="auth-checkbox__text">
                      <strong>이용약관</strong> 및
                      <strong>개인정보 처리방침</strong>에 동의합니다.
                    </span>
                  </label>
                </div>
              </div>
            </fieldset>

            <!-- 액션 영역 -->
            <div class="form__group auth-form__actions">
              <button
                type="submit"
                class="btn btn--primary btn--signup auth-form__submit"
              >
                회원가입
              </button>
              <a
                href="./login.html"
                class="auth-form__link"
                aria-label="로그인 페이지로 이동"
              >
                이미 계정이 있으신가요?
                <span class="auth-form__link--accent">로그인</span>
              </a>
            </div>

            <!-- 소셜 가입 (옵션) -->
            <div
              class="auth-social"
              aria-label="소셜 회원가입"
            >
              <button
                type="button"
                class="auth-social__btn auth-social__btn--naver"
                aria-disabled="true"
                title="향후 연동 예정"
              >
                <i class="fa-brands fa-neos"></i> 네이버
              </button>
              <button
                type="button"
                class="auth-social__btn auth-social__btn--google"
                aria-disabled="true"
                title="향후 연동 예정"
              >
                <i class="fa-brands fa-google"></i> 구글
              </button>
              <button
                type="button"
                class="auth-social__btn auth-social__btn--kakao"
                aria-disabled="true"
                title="향후 연동 예정"
              >
                <i class="fa-solid fa-comment"></i> 카카오
              </button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
